# DXVK settings for Fallout: New Vegas with FNVVRMC (VR)
# To go back to ENB/ENBoost: delete d3d9.dll and dxvk.conf, rename d3d9.dll.enb_backup to d3d9.dll.

# The headset sets the pace (FNVVRMC waits for SteamVR every frame) - never wait for the monitor too,
# and never queue frames ahead: each frame shows the newest head position.
d3d9.presentInterval = 0
d3d9.maxFrameLatency = 1
dxvk.tearFree = False
d3d9.maxFrameRate = 0

# Fewer hitches: build shaders in the background as soon as they're needed (cached after the first time).
dxvk.enableGraphicsPipelineLibrary = True

# Sharper textures at angles (looking down at the ground in VR) - free on a modern card.
d3d9.samplerAnisotropy = 16

# The game is 32-bit (4 GB at most): keep DXVK's own memory use small so there's more room for the game.
d3d9.textureMemory = 64
# ...and let DXVK throw away shader setups it no longer uses (meant for 32-bit games), and report a sane amount of video memory.
dxvk.trackPipelineLifetime = True
d3d9.maxAvailableMemory = 4096
