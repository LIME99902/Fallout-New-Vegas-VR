; FNVR settings - minimal starter file.
; FNVR fills in every other setting with its default the first time it runs,
; and the in-game VR Settings panel (hold both thumbsticks for a second, or F11) saves here.
[Display]
bHeadsetDisplay=1
bMatchHeadsetFOV=1
[Stereo]
i3DMode=2
fWorldScale=70.0
[Controls]
bMotionControls=1
bHandAim=1
bLeftHanded=0
bWristPipBoy=1
bPipBoyRealTime=1
bPipBoyLiveWorld=1
[PipScreen]
bDrawMenu=1
bShowScreenBox=1
bMenuBackground=1
[KidFriendly]
bBloodyMessExplodes=1
bDismemberment=1
bBlood=1
[HUD]
; 0 = classic (the game's HUD in front of you), 1 = VR (compass on the Pip-Boy wrist, health and AP on the other wrist,
; each gun's ammo by its hand), 2 = custom (HUD & menus > HUD parts: move & resize)
iLayout=0
